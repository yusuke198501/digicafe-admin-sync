name: mailnum_uf 確認

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: 対象日（YYYY-MM-DD、省略時は日本時間の当日）
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, UF-0049]
    defaults:
      run:
        shell: powershell
    steps:
      - name: Verify dedicated PC
        run: |
          if ($env:COMPUTERNAME -ne 'UF-0049') { throw 'This job must run on UF-0049.' }
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/inspect-mailnum-uf.js
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          LOG_ACCOUNT: ${{ secrets.LOG_ACCOUNT }}
          LOG_PASSWORD: ${{ secrets.LOG_PASSWORD }}
