name: mailnum2 を目標＆振分へ反映

on:
  workflow_dispatch:
    inputs:
      report_hour:
        description: 書き込む論理時刻
        required: true
        type: choice
        options: ['9', '12', '15', '18', '21', '24', '27']
  schedule:
    # 日本時間 0, 3, 6, 9, 12, 15, 18, 21時の50分
    # 時刻ごとに分けることで github.event.schedule から確実に判定する。
    - cron: '50 0 * * *'
    - cron: '50 3 * * *'
    - cron: '50 6 * * *'
    - cron: '50 9 * * *'
    - cron: '50 12 * * *'
    - cron: '50 15 * * *'
    - cron: '50 18 * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install

      - run: npm run sync-mailnum2
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          REPORT_HOUR: ${{ inputs.report_hour || github.event.inputs.report_hour }}
          PHPLITEADMIN_PASSWORD: ${{ secrets.PHPLITEADMIN_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.MAILNUM2_SPREADSHEET_ID }}
