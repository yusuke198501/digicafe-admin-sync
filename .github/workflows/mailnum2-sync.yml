name: mailnum2 sync

on:
  workflow_dispatch:
    inputs:
      report_hour:
        description: Target reporting hour (leave blank when started by Cloud Scheduler)
        required: false
        type: choice
        options: ['9', '12', '15', '18', '21', '24', '27']
  schedule:
    # JST 9, 12, 15, 18, 21, 24, 27.  Each cron is separate so the
    # script can retain the intended slot even if GitHub starts it late.
    - cron: '15 0 * * *'   # 09:15 JST
    - cron: '15 3 * * *'   # 12:15 JST
    - cron: '15 6 * * *'   # 15:15 JST
    - cron: '15 9 * * *'   # 18:15 JST
    - cron: '15 12 * * *'  # 21:15 JST
    - cron: '15 15 * * *'  # 24:15 JST
    - cron: '15 18 * * *'  # 27:15 JST

permissions:
  contents: read

concurrency:
  group: mailnum2-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install

      - run: npm run sync-mailnum2
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          REPORT_HOUR: ${{ inputs.report_hour || github.event.inputs.report_hour }}
          PHPLITEADMIN_PASSWORD: ${{ secrets.PHPLITEADMIN_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.MAILNUM2_SPREADSHEET_ID }}
