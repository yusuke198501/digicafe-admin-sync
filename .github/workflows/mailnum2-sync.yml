name: mailnum2 sync

on:
  schedule:
    # UTC。日本時間の 9, 10, 13, 17, 21, 24, 27 時の各5分頃。
    - cron: '5 0 * * *'
    - cron: '5 1 * * *'
    - cron: '5 4 * * *'
    - cron: '5 8 * * *'
    - cron: '5 12 * * *'
    - cron: '5 15 * * *'
    - cron: '5 18 * * *'
    # 予備実行。同じ時間帯の行を最新値で上書きし、定刻起動の欠落に備える。
    - cron: '45 0 * * *'
    - cron: '45 1 * * *'
    - cron: '45 4 * * *'
    - cron: '45 8 * * *'
    - cron: '45 12 * * *'
    - cron: '45 15 * * *'
    - cron: '45 18 * * *'
  workflow_dispatch:
    inputs:
      report_hour:
        description: Target reporting hour (leave blank when started by Cloud Scheduler)
        required: false
        type: choice
        options: ['9', '10', '13', '17', '21', '24', '27']
permissions:
  contents: read

concurrency:
  group: mailnum2-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install

      - run: npm run sync-mailnum2
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          REPORT_HOUR: ${{ inputs.report_hour || github.event.inputs.report_hour }}
          LOG_ACCOUNT: ${{ secrets.LOG_ACCOUNT }}
          LOG_PASSWORD: ${{ secrets.LOG_PASSWORD }}
          PHPLITEADMIN_PASSWORD: ${{ secrets.PHPLITEADMIN_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.MAILNUM2_SPREADSHEET_ID }}
