name: 管理画面データ更新

on:
  # UTC 21:10 / 21:30 = 日本時間の毎朝 06:10 / 06:30。
  # 6:10を主実行、6:30を再試行枠として、GitHubのスケジュール遅延・欠落に備える。
  schedule:
    - cron: '10 21 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:

concurrency:
  group: admin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install

      - run: npm run sync-admin
        env:
          ADMIN_DIGICAFE_USERNAME: ${{ secrets.ADMIN_DIGICAFE_USERNAME }}
          ADMIN_DIGICAFE_PASSWORD: ${{ secrets.ADMIN_DIGICAFE_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
