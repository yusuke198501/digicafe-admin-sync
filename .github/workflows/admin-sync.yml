name: 管理画面データ更新

on:
  # UTC 21:10 / 21:30 = 日本時間の毎朝 06:10 / 06:30。
  # 6:10を主実行、6:30を再試行枠として、GitHubのスケジュール遅延・欠落に備える。
  schedule:
    - cron: '10 21 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate DC summary sources and mapping without writes
        type: boolean
        default: false
      summary_only:
        description: Run only the migrated DC summary and advertising data update
        type: boolean
        default: false
      report_date:
        description: Target data date (YYYY-MM-DD; empty means yesterday JST)
        type: string
        required: false

concurrency:
  group: admin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, Windows, X64, UF-0049]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell

    steps:
      - name: Verify dedicated PC
        run: |
          if ($env:COMPUTERNAME -ne 'UF-0049') { throw 'This job must run on UF-0049.' }

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test migrated DC summary
        id: dc_tests
        run: node --test scripts/sync-dc-summary.test.js

      - run: npm run sync-admin
        if: ${{ inputs.dry_run != true && inputs.summary_only != true }}
        env:
          ADMIN_DIGICAFE_USERNAME: ${{ secrets.ADMIN_DIGICAFE_USERNAME }}
          ADMIN_DIGICAFE_PASSWORD: ${{ secrets.ADMIN_DIGICAFE_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

      - name: Update DC summary and advertising data on UF-0049
        if: ${{ always() && !cancelled() && steps.dc_tests.outcome == 'success' }}
        run: node scripts/sync-dc-summary.js
        env:
          DC_DRY_RUN: ${{ inputs.dry_run }}
          REPORT_DATE: ${{ inputs.report_date }}
          LOG_ACCOUNT: ${{ secrets.LOG_ACCOUNT }}
          LOG_PASSWORD: ${{ secrets.LOG_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

