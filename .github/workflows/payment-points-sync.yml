name: Point history count (read only UF-0049)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: point-history-readonly-20261124
  cancel-in-progress: false
jobs:
  count:
    runs-on: [self-hosted, Windows, X64, UF-0049]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
        shell: powershell
      - run: node scripts/count-point-history.js
        shell: powershell
        env:
          ADMIN_DIGICAFE_USERNAME: ${{ secrets.ADMIN_DIGICAFE_USERNAME }}
          ADMIN_DIGICAFE_PASSWORD: ${{ secrets.ADMIN_DIGICAFE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: point-history-count
          path: point-history-count.json
          retention-days: 7
