name: Analysis GA4 read-only check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Windows, X64, UF-0049]
    defaults:
      run:
        shell: powershell
    timeout-minutes: 3
    steps:
      - name: Verify dedicated PC
        run: |
          if ($env:COMPUTERNAME -ne 'UF-0049') { throw 'This job must run on UF-0049.' }
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check existing Analytics authorization without spreadsheet writes
        env:
          GA4_AUTH_MODE: 'service_account'
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_OAUTH_JSON: ${{ secrets.GA4_OAUTH_JSON }}
          GA4_PROBE_ONLY: 'false'
        run: |
          $source = @'
          import {fetchGa4Realtime} from './scripts/ga4-realtime.mjs';
          try{console.log('GA4_ACTIVE_MALE_5_MIN='+await fetchGa4Realtime());}
          catch(e){console.log(/^GA4_[A-Z0-9_]+$/.test(e.message)?e.message:'GA4_REQUEST_FAILED');process.exitCode=1;}
          '@
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE '.dc-workflow-check.mjs'
          [System.IO.File]::WriteAllText($scriptPath, $source, (New-Object System.Text.UTF8Encoding($false)))
          node $scriptPath
