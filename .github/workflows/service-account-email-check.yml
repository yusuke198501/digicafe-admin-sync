name: Temporary service account email check
on:
  workflow_dispatch:
permissions: {}
jobs:
  check-email:
    runs-on: ubuntu-latest
    steps:
      - name: Show client email only
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: python
        run: |
          import json, os, re, sys
          try:
              email = json.loads(os.environ['SERVICE_ACCOUNT_JSON']).get('client_email', '')
              if not re.fullmatch(r'[a-zA-Z0-9._+-]+@[a-zA-Z0-9.-]+', email):
                  raise ValueError()
          except Exception:
              print('Unable to read a valid client_email. No credential details logged.')
              sys.exit(1)
          print('Service account email: ' + email)
