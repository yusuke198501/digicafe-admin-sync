name: CATS click count verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-cats-clicks.mjs
        env:
          CATS_API_TOKEN: ${{ secrets.CATS_API_TOKEN }}
