name: 本日結果更新

on:
  schedule:
    # UTC 00:10〜18:10 = 日本時間の9:10〜翌3:10。mailnum2集計（毎時:05）と競合させない。
    - cron: '10 0-18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: today-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install

      - run: npm run sync-mailnum2
        env:
          TODAY_RESULTS_ONLY: '1'
          LOG_ACCOUNT: ${{ secrets.LOG_ACCOUNT }}
          LOG_PASSWORD: ${{ secrets.LOG_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.MAILNUM2_SPREADSHEET_ID }}
