name: 本日結果更新
on:
  workflow_dispatch:
    inputs:
      feliz_only:
        description: Test or retry only Feliz without repeating the DC update
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: today-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run sync-mailnum2
        if: ${{ inputs.feliz_only != true }}
        env:
          TODAY_RESULTS_ONLY: '1'
          LOG_ACCOUNT: ${{ secrets.LOG_ACCOUNT }}
          LOG_PASSWORD: ${{ secrets.LOG_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.MAILNUM2_SPREADSHEET_ID }}

      - name: Feliz 本日結果更新
        run: node scripts/sync-feliz-today-results.js
        env:
          FELIZ_ACCOUNT: ${{ secrets.FELIZ_ACCOUNT }}
          FELIZ_PASSWORD: ${{ secrets.FELIZ_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.MAILNUM2_SPREADSHEET_ID }}

