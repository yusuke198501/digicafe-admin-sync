name: 本日結果更新
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: Target date (YYYY-MM-DD); omit for the current business day
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: today-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, Windows, X64, UF-0049]
    defaults:
      run:
        shell: powershell
    timeout-minutes: 10
    steps:
      - name: Verify dedicated PC
        run: |
          if ($env:COMPUTERNAME -ne 'UF-0049') { throw 'This job must run on UF-0049.' }
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run sync-mailnum2
        env:
          TODAY_RESULTS_ONLY: '1'
          REPORT_DATE: ${{ inputs.report_date || '' }}
          LOG_ACCOUNT: ${{ secrets.LOG_ACCOUNT }}
          LOG_PASSWORD: ${{ secrets.LOG_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.MAILNUM2_SPREADSHEET_ID }}
