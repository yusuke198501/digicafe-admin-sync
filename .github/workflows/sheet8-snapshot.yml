name: シート8 5分集計
on:
  workflow_dispatch:
    inputs:
      payment_probe:
        description: 'Read-only payment point test (no spreadsheet writes)'
        type: boolean
        default: false
      leave_probe:
        description: 'Read-only male voluntary departure test (no spreadsheet writes)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: sheet8-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/sync-sheet8.test.js scripts/payment-points.test.js scripts/voluntary-leaves.test.js
      - run: node scripts/sync-sheet8.js
        env:
          PAYMENT_PROBE_ONLY: ${{ inputs.payment_probe }}
          LEAVE_PROBE_ONLY: ${{ inputs.leave_probe }}
          GITHUB_TOKEN: ${{ github.token }}
          CATS_API_TOKEN: ${{ secrets.CATS_API_TOKEN }}
          LOG_ACCOUNT: ${{ secrets.LOG_ACCOUNT }}
          LOG_PASSWORD: ${{ secrets.LOG_PASSWORD }}
          ADMIN_DIGICAFE_USERNAME: ${{ secrets.ADMIN_DIGICAFE_USERNAME }}
          ADMIN_DIGICAFE_PASSWORD: ${{ secrets.ADMIN_DIGICAFE_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.MAILNUM2_SPREADSHEET_ID }}
