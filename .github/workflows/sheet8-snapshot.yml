name: シート8 30分集計・GA4 5分集計
on:
  workflow_dispatch:
    inputs:
      final_previous_day:
        description: 'Save previous day final totals as 23:59'
        type: boolean
        default: false
      cohort_graph_setup:
        description: 'Set up cohort login charts and comparison only (no snapshot append)'
        type: boolean
        default: false
      ga4_probe:
        description: 'Read-only GA4 realtime test'
        type: boolean
        default: false
      payment_probe:
        description: 'Read-only payment point test (no spreadsheet writes)'
        type: boolean
        default: false
      leave_probe:
        description: 'Read-only male voluntary departure test (no spreadsheet writes)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: sheet8-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: [self-hosted, Windows, X64, UF-0049]
    defaults:
      run:
        shell: powershell
    timeout-minutes: 4
    steps:
      - name: Verify dedicated PC
        run: |
          if ($env:COMPUTERNAME -ne 'UF-0049') { throw 'This job must run on UF-0049.' }
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/final-snapshot.test.mjs scripts/ga4-snapshots.test.mjs scripts/cohort-login-charts.test.mjs scripts/cohort-logins.test.js scripts/sync-sheet8.test.js scripts/payment-points.test.js scripts/voluntary-leaves.test.js scripts/ga4-realtime.test.mjs scripts/ga4-chart.test.mjs scripts/all-received-chart.test.mjs scripts/expanded-chart.test.mjs scripts/expanded-chart.test.mjs
      - run: node scripts/sync-sheet8.js
        id: snapshot
        if: ${{ !inputs.payment_probe }}
        env:
          FINAL_PREVIOUS_DAY: ${{ inputs.final_previous_day }}
          COHORT_GRAPH_SETUP_ONLY: ${{ inputs.cohort_graph_setup }}
          GA4_PROBE_ONLY: ${{ inputs.ga4_probe }}
          GA4_AUTH_MODE: 'service_account'
          GA4_OAUTH_JSON: ${{ secrets.GA4_OAUTH_JSON }}
          PAYMENT_POINTS_EXTERNAL: 'true'
          LEAVE_PROBE_ONLY: ${{ inputs.leave_probe }}
          GITHUB_TOKEN: ${{ github.token }}
          CATS_API_TOKEN: ${{ secrets.CATS_API_TOKEN }}
          LOG_ACCOUNT: ${{ secrets.LOG_ACCOUNT }}
          LOG_PASSWORD: ${{ secrets.LOG_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: '1gsDZpoK1WZ4iZN4F8AqCdRw2EJotpixposi8KgIy4gU'
      - name: Dispatch payment-only update to UF-0049
        if: ${{ steps.snapshot.outputs.snapshot_timestamp != '' || inputs.payment_probe }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAYMENT_TIMESTAMP: ${{ steps.snapshot.outputs.snapshot_timestamp }}
          PAYMENT_PROBE: ${{ inputs.payment_probe || false }}
          PAYMENT_RUNNER_ENABLED: ${{ vars.PAYMENT_RUNNER_ENABLED }}
        run: |
          if ($env:PAYMENT_RUNNER_ENABLED -ne 'true') {
            Write-Output 'UF-0049 setup pending; payment points retain the same-day previous value.'
            exit 0
          }
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            $env:Path = (Join-Path $env:ProgramFiles 'GitHub CLI') + ';' + $env:Path
          }
          gh workflow run payment-points-sync.yml --repo $env:GITHUB_REPOSITORY --ref main --field "timestamp=$env:PAYMENT_TIMESTAMP" --field "probe=$env:PAYMENT_PROBE"
